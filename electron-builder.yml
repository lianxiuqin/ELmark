appId: com.elmark.desktop
productName: ELmark
directories:
  output: dist
files:
  - "out/**/*"
  - "package.json"
win:
  signAndEditExecutable: false
  target:
    - target: nsis
      arch:
        - x64
    - target: dir
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  artifactName: "ELmark-Setup-${version}.exe"
  uninstallDisplayName: "ELmark ${version}"
fileAssociations:
  - ext: md
    name: Markdown Document
    description: Markdown Document
  - ext: markdown
    name: Markdown Document
    description: Markdown Document
